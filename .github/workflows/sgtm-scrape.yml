name: SGTM live price scrape

on:
  # Séance Bourse de Casablanca (BVC) : 9h30 → 15h30 heure Casablanca, lundi-vendredi.
  # Maroc = UTC+1 toute l'année depuis 2018 (heure légale marocaine, DST permanent).
  # Exception : pendant le Ramadan (~30 jours/an, dates lunaires), Maroc passe à UTC+0.
  #
  # Mapping UTC (hors Ramadan) :
  #   9h30 Casablanca = 8h30 UTC (ouverture)
  #   15h30 Casablanca = 14h30 UTC (clôture)
  #
  # Cron choisi : `30 8-14 * * 1-5` → 7 runs à :30 de chaque heure entre 8h30 et 14h30 UTC.
  #   - Capture l'ouverture (run 8h30 UTC)
  #   - 5 runs intraday (9h30, 10h30, 11h30, 12h30, 13h30 UTC)
  #   - Capture la clôture (run 14h30 UTC)
  # Les délais GitHub Actions (jusqu'à ~15 min) sont absorbés par la marge de :30 :
  # un run "ouverture" qui fire à 8h42 UTC tombe à 9h42 local = 12 min après l'ouverture.
  #
  # Pendant le Ramadan (UTC+0) la séance est 9h30-15h30 UTC : on manquerait la dernière
  # heure (14h30-15h30). Acceptable : le badge "dernier relevé" gère la staleness, et on
  # pourra étendre temporairement si nécessaire (~30 jours/an).
  schedule:
    - cron: '30 8-14 * * 1-5'
  # Manuel (test, debug) + sur push du script
  workflow_dispatch:
  push:
    paths:
      - 'scripts/scrape_sgtm.py'
      - '.github/workflows/sgtm-scrape.yml'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Pas de `cache: pip` car pas de requirements.txt committé — évite
          # l'erreur "No file matched to [pip]" qui fait échouer le job en 3s.

      # 19/09/2026 : plus de Playwright — les 3 sources navigateur étaient mortes
      # (URL BVC 301, idbourse derrière login, investing sélecteur). Les deux sources
      # actuelles sont du HTTP simple ; certifi fournit les racines TLS (voir en-tête du script).
      - name: Install certifi
        run: python -m pip install --disable-pip-version-check certifi

      # Plus de `continue-on-error` : il laissait le job VERT alors qu'aucune source ne
      # répondait (prix figé du 05/08 au 19/09/2026 sans alerte). Un échec = job ROUGE.
      - name: Scrape SGTM
        env:
          DEBUG_DIR: ${{ runner.temp }}/scrape_debug
        run: python scripts/scrape_sgtm.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug-${{ github.run_id }}
          path: ${{ runner.temp }}/scrape_debug
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated price
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # v369 (BUG-077) : committer AUSSI sgtm_history.json. Le scraper l'upserte à chaque
          # run mais l'ancien `git add` ne stageait que le live → l'historique n'était jamais
          # persisté (figé au backfill d'avril) et la fonction « prix à une date donnée »
          # (getMoroccanPriceAt) travaillait sur des données périmées.
          git add data/sgtm_live.json data/sgtm_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            PRICE=$(python -c "import json; print(json.load(open('data/sgtm_live.json'))['priceMAD'])")
            SOURCE=$(python -c "import json; print(json.load(open('data/sgtm_live.json'))['source'])")
            git commit -m "chore(sgtm): live price ${PRICE} MAD (source: ${SOURCE})"
            # Rebase si main a bougé pendant le run (sinon push rejeté → job rouge à tort).
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}"
            git push
          fi

      # Garde-fou indépendant : même si toutes les étapes ci-dessus passent, le job
      # échoue si le JSON committé a plus de 3 jours ouvrés (push raté, source figée…).
      - name: Check price freshness
        if: always()
        run: python scripts/scrape_sgtm.py --check-staleness 3
